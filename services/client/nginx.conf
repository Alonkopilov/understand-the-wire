server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # The bundle is ~220 kB uncompressed and ~69 kB gzipped, and Vite does not
    # pre-compress. Without this nginx serves the full size to every visitor.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The ALB target group health-checks this path, and k8s/apps/health.yaml
    # routes it to this service. If it stops returning 200 the load balancer
    # takes the node out of service and the site goes down.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints these filenames, so a given URL's content never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell and anything in public/. Never cached: index.html is what points
    # at the current asset hashes, so a stale copy pins the browser to a
    # previous deploy's JavaScript.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
