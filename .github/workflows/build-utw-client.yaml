name: Build and Publish Client

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/client/**'

env:
  REGISTRY: ghcr.io
  SERVICE: client

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "deployed_env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "deployed_env=dev" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Login to Github Packages Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/understand-the-wire-${{ env.SERVICE }}-${{ steps.env.outputs.deployed_env }}
          tags: |
            type=sha,format=short
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
      
      - name: Build and Publish image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ env.SERVICE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.SERVICE }}
          cache-to: type=gha,mode=max,scope=${{ env.SERVICE }}