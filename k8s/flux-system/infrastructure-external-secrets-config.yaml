apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  interval: 10m

  path: ./k8s/infrastructure/external-secrets/config

  prune: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: external-secrets-release