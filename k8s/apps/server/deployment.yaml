apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: understand-the-wire
spec:
  replicas: 3
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: Example # {"$imagepolicy": "flux-system:server-imagepolicy"}
        resources:
          limits:
            memory: 128Mi
            cpu: 100m
          requests:
            memory: 128Mi
            cpu: 40m
