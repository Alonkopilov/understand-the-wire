apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 12h
  url: https://charts.external-secrets.io

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  targetNamespace: external-secrets
  interval: 10m
  chart:
    spec:
      chart: external-secrets
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system

  releaseName: external-secrets

  values:
    crds:
      create: true
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::744092294111:role/external-secrets-external-secrets-role
  