apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configs
  namespace: flux-system
spec:
  interval: 10m

  path: ./k8s/infrastructure/configs

  prune: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: controllers
  
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: vars